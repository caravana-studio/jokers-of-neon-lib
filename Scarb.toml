[package]
cairo-version = "2.12.1"
name = "jokers_of_neon_lib"
version = "0.19.0"
edition = "2023_01"

[cairo]
sierra-replace-ids = true

[tool.fmt]
sort-module-level-items = true
max-line-length = 120

[dependencies]
dojo = { git = "https://github.com/dojoengine/dojo", tag = "v1.7.0-alpha.3" }
dojo_macros = { git = "https://github.com/dojoengine/dojo", tag = "v1.7.0-alpha.3" }
starknet = "2.12.1"

[[target.starknet-contract]]
build-external-contracts = ["dojo::world::world_contract::world"]

[lib]

[dev-dependencies]
cairo_test = "=2.12.1"
dojo_cairo_test = { git = "https://github.com/dojoengine/dojo", tag = "v1.7.0-alpha.3" }
